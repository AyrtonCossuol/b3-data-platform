name: b3-data-platform

services:

  # ============================================================
  # KAFKA
  # ============================================================

  kafka:
    image: apache/kafka:4.3.1
    container_name: b3-kafka
    hostname: kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_LOG_DIRS: /var/lib/kafka/data

      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list > /dev/null 2>&1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    restart: unless-stopped

    networks:
      - b3-network


  # ============================================================
  # KAFKA INIT
  # ============================================================

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: b3-kafka-init

    depends_on:
      kafka:
        condition: service_healthy

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        set -eu

        echo "Waiting for Kafka..."

        until /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --list > /dev/null 2>&1
        do
          echo "Kafka is not ready yet..."
          sleep 2
        done

        echo "Kafka is ready."

        echo "Creating topic b3.cotahist.raw.v1..."

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic b3.cotahist.raw.v1 \
          --partitions 3 \
          --replication-factor 1

        echo "Available topics:"

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --list

        echo "Kafka initialization completed successfully."

    networks:
      - b3-network


  # ============================================================
  # MINIO
  # ============================================================

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: b3-minio
    hostname: minio

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION_NAME: us-east-1

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    restart: unless-stopped

    networks:
      - b3-network


  # ============================================================
  # MINIO INIT
  # ============================================================

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: b3-minio-init

    depends_on:
      minio:
        condition: service_started

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

      MINIO_SPARK_ACCESS_KEY: ${MINIO_SPARK_ACCESS_KEY}
      MINIO_SPARK_SECRET_KEY: ${MINIO_SPARK_SECRET_KEY}

    volumes:
      - ./infra/minio/spark-policy.json:/tmp/spark-policy.json:ro

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        set -eu

        echo "Waiting for MinIO..."

        until mc alias set \
          local \
          http://minio:9000 \
          "$${MINIO_ROOT_USER}" \
          "$${MINIO_ROOT_PASSWORD}" \
          > /dev/null 2>&1
        do
          echo "MinIO is not ready yet..."
          sleep 2
        done

        mc ready local

        echo "MinIO is ready."

        echo "Creating buckets..."

        mc mb \
          --ignore-existing \
          local/b3-bronze

        mc mb \
          --ignore-existing \
          local/b3-checkpoints

        echo "Removing existing Spark user if necessary..."

        mc admin user rm \
          local \
          "$${MINIO_SPARK_ACCESS_KEY}" \
          > /dev/null 2>&1 || true

        echo "Removing existing Spark policy if necessary..."

        mc admin policy rm \
          local \
          b3-spark-rw \
          > /dev/null 2>&1 || true

        echo "Creating Spark service user..."

        mc admin user add \
          local \
          "$${MINIO_SPARK_ACCESS_KEY}" \
          "$${MINIO_SPARK_SECRET_KEY}"

        echo "Creating Spark policy..."

        mc admin policy create \
          local \
          b3-spark-rw \
          /tmp/spark-policy.json

        echo "Attaching Spark policy..."

        mc admin policy attach \
          local \
          b3-spark-rw \
          --user "$${MINIO_SPARK_ACCESS_KEY}"

        echo "Testing Spark credentials..."

        mc alias set \
          spark \
          http://minio:9000 \
          "$${MINIO_SPARK_ACCESS_KEY}" \
          "$${MINIO_SPARK_SECRET_KEY}"

        echo "Testing bucket listing..."

        mc ls spark/b3-bronze > /dev/null
        mc ls spark/b3-checkpoints > /dev/null

        echo "Testing Bronze write/delete..."

        echo "permission-test" > /tmp/test.txt

        mc cp \
          /tmp/test.txt \
          spark/b3-bronze/_permission_test.txt

        mc rm \
          spark/b3-bronze/_permission_test.txt

        echo "Testing Checkpoint write/delete..."

        mc cp \
          /tmp/test.txt \
          spark/b3-checkpoints/_permission_test.txt

        mc rm \
          spark/b3-checkpoints/_permission_test.txt

        echo "MinIO initialization completed successfully."

    networks:
      - b3-network


  # ============================================================
  # SPARK MASTER
  # ============================================================

  spark-master:
    image: spark:4.2.0-python3
    container_name: b3-spark-master
    hostname: spark-master

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"

    ports:
      - "7077:7077"
      - "8080:8080"

    restart: unless-stopped

    networks:
      - b3-network


  # ============================================================
  # SPARK WORKER
  # ============================================================

  spark-worker:
    image: spark:4.2.0-python3
    container_name: b3-spark-worker
    hostname: spark-worker

    depends_on:
      spark-master:
        condition: service_started

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "2"
      - --memory
      - 2G
      - --webui-port
      - "8081"

    ports:
      - "8081:8081"

    restart: unless-stopped

    networks:
      - b3-network


  # ============================================================
  # SPARK STRUCTURED STREAMING
  # ============================================================

  spark-streaming:
    image: spark:4.2.0-python3
    container_name: b3-spark-streaming
    hostname: spark-streaming

    depends_on:
      kafka-init:
        condition: service_completed_successfully

      minio-init:
        condition: service_completed_successfully

      spark-master:
        condition: service_started

      spark-worker:
        condition: service_started

    environment:

      # --------------------------------------------------------
      # Kafka
      # --------------------------------------------------------

      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_COTAHIST_TOPIC: b3.cotahist.raw.v1

      # --------------------------------------------------------
      # MinIO
      # --------------------------------------------------------

      MINIO_ENDPOINT: http://minio:9000
      MINIO_REGION: us-east-1

      MINIO_ACCESS_KEY: ${MINIO_SPARK_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SPARK_SECRET_KEY}

      # --------------------------------------------------------
      # Bronze
      # --------------------------------------------------------

      BRONZE_PATH: s3a://b3-bronze/b3/cotahist

      # --------------------------------------------------------
      # Checkpoint
      # --------------------------------------------------------

      CHECKPOINT_PATH: s3a://b3-checkpoints/b3/cotahist

      # --------------------------------------------------------
      # Streaming
      # --------------------------------------------------------

      STREAM_TRIGGER_INTERVAL: 30 seconds

      # A imagem Spark possui HOME=/nonexistent por padrão.
      # Definimos um HOME gravável.
      HOME: /tmp/spark-home

    ports:
      - "4040:4040"

    volumes:
      - ./streaming:/opt/spark/jobs:ro

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        set -eu

        echo "Preparing Spark directories..."

        mkdir -p /tmp/spark-home

        mkdir -p /tmp/spark-ivy
        mkdir -p /tmp/spark-ivy/cache
        mkdir -p /tmp/spark-ivy/jars

        echo "Starting Spark Structured Streaming..."

        exec /opt/spark/bin/spark-submit \
          --master spark://spark-master:7077 \
          --deploy-mode client \
          --packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.2.0,org.apache.hadoop:hadoop-aws:3.5.0 \
          --conf spark.driver.host=spark-streaming \
          --conf spark.driver.bindAddress=0.0.0.0 \
          --conf spark.ui.port=4040 \
          --conf spark.jars.ivy=/tmp/spark-ivy \
          --conf spark.executor.instances=1 \
          --conf spark.executor.cores=1 \
          --conf spark.executor.memory=1g \
          /opt/spark/jobs/bronze/cotahist_bronze_stream.py

    restart: on-failure

    networks:
      - b3-network


# ============================================================
# VOLUMES
# ============================================================

volumes:

  kafka_data:

  minio_data:


# ============================================================
# NETWORK
# ============================================================

networks:

  b3-network:
    driver: bridge